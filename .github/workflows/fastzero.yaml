name: Fast Zero CI
on:
  push:
    paths:
      - 'fast_zero/**'
      - '.github/workflows/fastzero.yaml'
  pull_request:
    paths:
      - 'fast_zero/**'
      - '.github/workflows/fastzero.yaml'

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      SECRET_KEY: ${{ secrets.SECRET_KEY }}
    defaults:
      run:
        working-directory: fast_zero
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: '0.12.17'

      - name: Install dependencies
        run: uv sync --locked

      - name: Run tests
        run: uv run task test
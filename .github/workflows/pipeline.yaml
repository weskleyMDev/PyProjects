name: Pipeline
on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: fast_zero
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: '0.12.17'

      - name: Install dependencies
        run: uv sync --locked

      - name: Check JWT configuration
        run: |
          uv run python -c "from fast_zero.settings import settings; print('ALGORITHM:', repr(settings.ALGORITHM)); print('SECRET_KEY definida:', isinstance(settings.SECRET_KEY, str) and bool(settings.SECRET_KEY))"

      # - name: Run tests
      #   run: uv run task test